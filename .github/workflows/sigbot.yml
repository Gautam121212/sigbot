# Sigbot autonomous run — everything happens on GitHub, nothing on your Mac.
#
# Every 3 hours GitHub's servers: run the models (record predictions), resolve
# the ones whose window closed, rebuild the site, commit the ledger back, and
# publish the site to GitHub Pages. You never open a terminal.
#
# One job does the whole thing. The site output (app/public) is gitignored and
# rebuilt fresh each run, so it is uploaded to Pages directly from this job —
# NOT re-checked-out from git (where it does not exist). That was the bug: a
# separate deploy job checked out a clean repo and app/public was not there.
name: sigbot

on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours (UTC) — fully automatic
  workflow_dispatch: {}         # also run on demand from the Actions tab

permissions:
  contents: write               # commit the ledger back
  pages: write                  # publish to Pages
  id-token: write               # Pages deploy auth

# Never run two ticks at once — they would fight over the commit.
concurrency:
  group: sigbot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests
          fi

      - name: Run one coordinator tick (record, resolve, publish)
        env:
          SEC_UA: ${{ vars.SEC_UA || 'sigbot research sigbot@dripxwear.com' }}
        run: |
          # Lift the halt so paper trading and all models run.
          python -m sigbot.runner resume || true
          python -m sigbot.coordinator --once || echo "tick finished with warnings"

      - name: Commit the updated ledger back to the repo
        run: |
          git config user.name  "sigbot"
          git config user.email "sigbot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed this tick."
          else
            git commit -m "tick: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Publish the site built by this same job (app/public exists here now).
      # If publish produced nothing, skip Pages instead of failing the run.
      - name: Check the site was built
        id: site
        run: |
          if [ -f app/public/index.html ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "No app/public/index.html — skipping Pages this tick."
          fi

      - name: Configure Pages
        if: steps.site.outputs.ok == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the published site
        if: steps.site.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/public

      - name: Deploy to GitHub Pages
        if: steps.site.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
