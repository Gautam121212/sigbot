# Sigbot autonomous run — everything happens on GitHub, nothing on your Mac.
#
# This runs the models on a schedule (GitHub's servers), records predictions,
# resolves the ones whose window closed, rebuilds the site, and commits the
# result back to the repo. GitHub Pages then serves the updated site. You never
# open a terminal.
#
# Schedule: every 3 hours. The daily models (stocks, ventures, ideas) only fire
# their once-a-day work when due; the frequent jobs (resolve, publish) keep the
# site current. Adjust the cron below to taste.
name: sigbot

on:
  schedule:
    - cron: "0 */3 * * *"      # every 3 hours (UTC)
  workflow_dispatch: {}         # also run on demand from the Actions tab

# Let the workflow commit the updated ledger + site back to the repo.
permissions:
  contents: write

# Never run two ticks at once — they would fight over the commit.
concurrency:
  group: sigbot-run
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the project's deps. Prefer requirements.txt; fall back to
          # the core libraries the runners need.
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests
          fi

      - name: Run one coordinator tick (record, resolve, publish)
        env:
          # SEC EDGAR wants a real contact; set SEC_UA in repo secrets/variables.
          SEC_UA: ${{ vars.SEC_UA || 'sigbot research sigbot@dripxwear.com' }}
        run: |
          python -m sigbot.coordinator --once || echo "tick finished with warnings"

      - name: Commit the updated ledger and site
        run: |
          git config user.name  "sigbot"
          git config user.email "sigbot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed this tick."
          else
            git commit -m "tick: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Pull-rebase then push, so overlapping ticks never clobber.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # Serve the site from GitHub Pages after each tick. This job is allowed to
  # fail without failing the whole run — the tick (recording predictions and
  # committing) is what matters; a Pages config hiccup must not block it.
  deploy-pages:
    needs: tick
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out (with the fresh commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages if it isn't turned on yet, instead of failing.
          enablement: true

      - name: Upload the published site
        uses: actions/upload-pages-artifact@v3
        with:
          # publish writes the site to app/public/index.html
          path: app/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
