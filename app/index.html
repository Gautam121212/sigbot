<title>SIGBOT Dashboard</title>
<style>
/* Small shell: fetches data.json + status.json. Layout: fixed left rail (desktop) /
   bottom nav (mobile) + sticky status bar + scrolling content. SIGBOT dark palette. */
:root{
  --bg:#0a0a0f; --surface:#111118; --surface-2:#15151f; --raise:#1a1a26;
  --line:#20202c; --line-2:#2a2a38;
  --text:#e9ebf2; --dim:#9aa4b8; --faint:#646f88;
  --teal:#2dd4bf; --green:#34d399; --indigo:#8b93ff; --amber:#fbbf24; --red:#f87171; --purple:#a98bff;
  --accent:var(--teal);
  --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --r:14px; --r-sm:9px;
  --sans:"Inter","Helvetica Neue",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:20px 14px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--teal),var(--indigo));display:grid;place-items:center;font-weight:800;font-size:13px;color:#06121a;letter-spacing:-.04em}
.brand .wordmark{font-weight:700;letter-spacing:.14em;font-size:13px}
.navlabel{font-size:10px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;padding:14px 10px 6px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--dim);font-size:13.5px;font-weight:500;transition:background .15s,color .15s;width:100%;text-align:left}
.navitem svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.navitem:hover{background:var(--surface-2);color:var(--text)}
.navitem[aria-current="true"]{background:var(--raise);color:var(--text)}
.navitem[aria-current="true"] svg{stroke:var(--teal)}
.rail-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.6}
.rail-foot .fresh{display:flex;align-items:center;gap:7px;color:var(--dim);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent)}
.dot.stale{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 20%,transparent)}
.dot.fail{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 20%,transparent)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;padding:14px 26px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px}
.topbar .sub{color:var(--faint);font-size:12px;margin-top:2px}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line-2);border-radius:999px;font-size:12px;color:var(--dim);background:var(--surface)}
.chip .dot{width:6px;height:6px;box-shadow:none}
.content{padding:26px;max-width:1180px;width:100%;display:flex;flex-direction:column;gap:26px}
.section{display:flex;flex-direction:column;gap:22px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.muted{color:var(--dim)} .faint{color:var(--faint)}
.subhead{display:flex;align-items:center;gap:10px;margin:2px 0}
.subhead h3{font-size:13px;letter-spacing:.02em}
.quar-tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 38%,transparent);background:color-mix(in srgb,var(--amber) 10%,transparent);padding:3px 9px;border-radius:999px;font-weight:600}

.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ring-wrap{display:grid;place-items:center;position:relative}
.ring-wrap .ctr{position:absolute;text-align:center}
.ring-wrap .ctr b{display:block;font-size:30px;font-weight:700;font-family:var(--mono)}
.ring-wrap .ctr span{font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.hero-copy h2{font-size:22px;margin-bottom:8px}
.hero-copy p{color:var(--dim);margin:0;max-width:60ch}
.hero-copy .note{font-size:12.5px;color:var(--faint);margin-top:10px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .k{font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.tile .v{font-size:26px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
.tile .v.sm{font-size:19px}
.tile .d{font-size:12px;color:var(--dim)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.row-head h3{font-size:15px}
.count{font-size:11px;color:var(--faint);letter-spacing:.1em}

.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:border-color .15s,transform .15s}
.mcard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.mcard.quar{opacity:.92;border-style:dashed}
.mcard .bar{height:3px;background:var(--ac)}
.mcard .body{padding:17px 18px;display:flex;flex-direction:column;gap:13px;flex:1}
.mcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mcard .name{font-size:15.5px;font-weight:600}
.mcard .subtitle{font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.45}
.badge{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:4px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line-2);color:var(--dim);background:var(--surface-2)}
.tier{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:6px;display:inline-block}
.tier.SILENT{color:var(--faint);background:var(--raise)}
.tier.CAUTION{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.tier.TRADE{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}
.meter{display:flex;flex-direction:column;gap:5px}
.meter .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)}
.track{height:6px;background:var(--raise);border-radius:999px;overflow:hidden;position:relative}
.track>i{display:block;height:100%;border-radius:999px;background:var(--ac)}
.track.hr>i{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 55%,transparent),var(--ac))}
.track .null{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--faint);opacity:.85}
.mcard .foot{font-size:11.5px;color:var(--faint);line-height:1.5;border-top:1px solid var(--line);padding-top:11px;margin-top:auto}
.empty{font-size:12.5px;color:var(--faint);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:12px 14px;line-height:1.5}

.bk{display:flex;flex-direction:column;gap:2px}
.bk .row{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.bk .row:last-child{border-bottom:none}
.bk .per{font-size:13px;font-weight:500}
.bk .det{font-size:12px;color:var(--dim)}
.bk .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
.bk .pill.no{color:var(--dim);background:var(--raise)}
.bk .pill.yes{color:var(--green);background:color-mix(in srgb,var(--green) 16%,transparent)}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.fchip{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--dim);background:var(--surface);transition:.15s}
.fchip:hover{color:var(--text);border-color:var(--faint)}
.fchip[aria-pressed="true"]{color:#06121a;background:var(--teal);border-color:var(--teal);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:6px 13px;min-width:180px}
.search input{background:none;border:none;color:var(--text);font-size:13px;width:100%;outline:none}
.search svg{width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:1.8}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 14px;background:var(--surface-2);position:sticky;top:0}
td{padding:11px 14px;border-top:1px solid var(--line)}
tbody tr:hover{background:var(--surface-2)}
.sidepill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px}
.sidepill.BUY{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.sidepill.SELL{color:var(--red);background:color-mix(in srgb,var(--red) 15%,transparent)}
.sym{font-weight:600;font-family:var(--mono)}
.pos{color:var(--green)} .neg{color:var(--red)}

.drawer-bg{position:fixed;inset:0;background:rgba(4,4,8,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .24s cubic-bezier(.2,.7,.2,1);overflow-y:auto}
.drawer.open{transform:none}
.drawer .dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:20px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.drawer .dbody{padding:22px;display:flex;flex-direction:column;gap:20px}
.xbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--dim);flex:none}
.xbtn:hover{background:var(--surface-2);color:var(--text)}
.falsi{border-left:3px solid var(--line-2);padding:4px 0 4px 14px;color:var(--dim);font-size:13px;line-height:1.55}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.stat-grid div{background:var(--surface);padding:12px 14px}
.stat-grid .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.stat-grid .v{font-size:17px;font-weight:700;font-family:var(--mono);margin-top:3px}

.ph{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:30px}
.ph .tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:600;border:1px solid color-mix(in srgb,var(--teal) 35%,transparent);padding:4px 10px;border-radius:999px}
.ph h3{font-size:17px}
.ph ul{margin:0;padding-left:18px;color:var(--dim);line-height:1.7;font-size:13.5px}
.curve{width:100%;height:auto;display:block}

@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .content{padding:18px 16px 92px;gap:20px}
  .topbar{padding:13px 16px}
  .hero{grid-template-columns:1fr;text-align:center;gap:18px;justify-items:center}
  .hero-copy p,.hero-copy .note{margin-inline:auto}
  .grid-2{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .mobnav{display:flex}
}
.mobnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.mobnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;color:var(--faint);padding:4px 6px;flex:1;letter-spacing:.02em}
.mobnav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
.mobnav button[aria-current="true"]{color:var(--teal)}
.updated-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--raise);border:1px solid var(--line-2);border-radius:999px;padding:9px 18px;font-size:13px;color:var(--text);z-index:50;opacity:0;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.4);pointer-events:none}
.updated-toast.show{opacity:1;transform:translateX(-50%)}
.disclaimer{font-size:11.5px;color:var(--faint);line-height:1.6;border-top:1px solid var(--line);padding-top:18px;max-width:70ch}
.loadscreen{display:grid;place-items:center;min-height:60vh;padding:30px;text-align:center}
</style>

<script>
"use strict";
const OPERATIONAL=new Set(["news","stocks","crypto","ventures"]); // fallback only when data carries no role
function roleOf(m){ return (m&&m.role) || (OPERATIONAL.has(m&&m.id)?"operational":"research"); }
const isResearchModel=m=>roleOf(m)==="research";
const ACMAP={teal:"var(--teal)",green:"var(--green)",indigo:"var(--indigo)",purple:"var(--purple)",amber:"var(--amber)",yellow:"var(--amber)",red:"var(--red)"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=x=>x==null?"—":(x*100).toFixed(0)+"%";
const money=x=>x==null?"—":"$"+Number(x).toLocaleString("en-US",{maximumFractionDigits:0});
const signPct=x=>x==null?"—":(x>=0?"+":"")+Number(x).toFixed(2)+"%";

let DATA=null, BUILD=null, curNav="command", refreshState="live";

async function fetchJSON(u){
  try{const r=await fetch(u,{cache:"no-store"});if(r.ok)return await r.json();}catch(e){}
  return null;
}
const idOf=d=>d&&(d.build||d.generated_at)||null;
function inlineData(){
  const el=document.getElementById("inline-data");
  if(!el) return null;
  const t=(el.textContent||"").trim();
  if(!t||t.indexOf("__SIGBOT_DATA")===0) return null;   // unfilled production placeholder
  try{return JSON.parse(t)}catch(e){return null}
}

/* Pure version-contract decision (unit-tested). status announces the build;
   data must carry the SAME build before we accept it — otherwise the fetch
   returned an older snapshot than status claims, and we keep what we have. */
function decideRefresh(currentBuild, status, data){
  const targetId = status ? idOf(status) : null;      // what the deploy says is current
  if(targetId && targetId===currentBuild) return {action:"noop"};
  if(!data) return {action:"fail"};                   // data fetch failed → keep current
  const dataId = idOf(data);
  if(targetId && dataId!==targetId) return {action:"fail"}; // announced build != data's build → stale/mismatch
  const finalId = targetId || dataId;                 // no status → trust data's own stamp
  if(!finalId) return {action:"fail"};
  if(finalId===currentBuild) return {action:"noop"};
  return {action:"update", build:finalId, data};
}

/* Shared I/O wrapper used by initial load, recovery, AND polling, so the same
   version contract applies everywhere. Fetches status first (short-circuit if
   unchanged), then data only when needed; verification is in decideRefresh.
   Pass currentBuild=null on first load / recovery (no build to compare yet). */
async function tryRefresh(currentBuild){
  const s=await fetchJSON("./status.json");
  if(s && idOf(s) && idOf(s)===currentBuild) return {action:"noop"};
  const data=await fetchJSON("./data.json");
  return decideRefresh(currentBuild, s, data);
}
async function poll(){
  const d=await tryRefresh(BUILD);
  if(d.action==="update"){DATA=d.data;BUILD=d.build;refreshState="live";render();showToast();}
  else if(d.action==="noop"){refreshState="live";freshness();}
  else {refreshState="failed";freshness();}
}
function showToast(){const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3200);}

function freshness(){
  const g=DATA&&DATA.generated_at?new Date(DATA.generated_at):null;
  const dot=document.getElementById("freshdot"), txt=document.getElementById("freshtxt");
  let mins=g?Math.round((Date.now()-g.getTime())/60000):null;
  let stale=mins!=null&&mins>240;
  dot.className="dot"+(refreshState==="failed"?" fail":stale?" stale":"");
  if(refreshState==="failed"){txt.textContent="Refresh failed — showing last good data";}
  else if(mins==null){txt.textContent="No timestamp";}
  else{const ago=mins<1?"just now":mins<60?mins+" min ago":Math.round(mins/60)+" h ago";txt.textContent="Data "+ago+(stale?" (stale)":"");}
  document.getElementById("buildtxt").textContent="Refreshes on each deploy";
  const cy=(DATA&&DATA.cycle)||{};
  document.getElementById("cycletxt").textContent=cy.phase?("Cycle: "+cy.phase):"—";
}

function ring(proven,total){
  const R=52,C=2*Math.PI*R, frac=total?proven/total:0;
  return `<svg width="132" height="132" viewBox="0 0 132 132" aria-label="${proven} of ${total} proven">
    <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="10"/>
    <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--teal)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" transform="rotate(-90 66 66)"/></svg>`;
}

    : `<div class="empty">Nothing checked yet. Stays quiet until it has a record to show.</div>`;
  return `<button class="mcard${quar?' quar':''}" style="--ac:${ac}" data-model="${esc(m.id)}">

function equityCurve(days){
  // days are newest-first; build ascending closing-equity series
  const d=[...days].reverse().map(r=>({x:r.date,y:r.closing}));
  if(d.length<2) return "";
  const ys=d.map(p=>p.y), min=Math.min(...ys), max=Math.max(...ys), span=(max-min)||1;
  const W=680,H=180,pad=8;
  const pts=d.map((p,i)=>[pad+i*(W-2*pad)/(d.length-1), H-pad-((p.y-min)/span)*(H-2*pad)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=path+` L${pts[pts.length-1][0].toFixed(1)} ${H-pad} L${pts[0][0].toFixed(1)} ${H-pad} Z`;
  const up=d[d.length-1].y>=d[0].y;
  const col=up?"var(--green)":"var(--red)";
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Equity curve">
    <path d="${area}" fill="${col}" opacity="0.08"/><path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.5" fill="${col}"/></svg>`;
}

  models:{t:"Models",s:"Every family, its evidence, and what would disprove it",r:modelsSection},
  evidence:{t:"Asset Evidence",s:"Aggregated per-asset records across families",r:evidenceSection},
  paper:{t:"Paper Portfolio",s:"Simulated book — capital locked, no real orders",r:paperSection},
  benchmarks:{t:"Benchmarks",s:"Measured return against pre-registered targets",r:benchmarksSection},
  research:{t:"Research Lab",s:"Pattern registry and learning feed",r:researchSection},
  health:{t:"System Health",s:"Operational status of each scan",r:healthSection},
};

function render(){
  freshness();
  const sec=SECTIONS[curNav]||SECTIONS.command;
  document.getElementById("sectitle").textContent=sec.t;
  document.getElementById("secsub").textContent=sec.s;
  document.getElementById("content").innerHTML=sec.r();
  document.querySelectorAll("[data-nav]").forEach(b=>b.setAttribute("aria-current", b.dataset.nav===curNav?"true":"false"));
  document.querySelectorAll("[data-model]").forEach(b=>b.onclick=()=>openModel(b.dataset.model));
  if(curNav==="evidence"){
    document.querySelectorAll(".fchip").forEach(c=>c.onclick=()=>{evFilter=c.dataset.f;render();});
    const si=document.getElementById("evsearch");
    if(si){si.oninput=e=>{evQuery=e.target.value;render();const s2=document.getElementById("evsearch");if(s2){s2.focus();s2.setSelectionRange(s2.value.length,s2.value.length);}};}
  }
}
function go(nav){curNav=nav;try{location.hash=nav}catch(e){}render();window.scrollTo({top:0});}
document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.nav)));
document.getElementById("drawerbg").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

let retryTimer=null, pollTimer=null;
function startPolling(){ if(pollTimer==null) pollTimer=setInterval(poll,150000); }
function showLoadError(){
  document.getElementById("content").innerHTML='<div class="loadscreen"><div><div class="eyebrow" style="color:var(--amber)">Could not load a consistent build</div><p class="muted" style="margin-top:8px;max-width:44ch">The latest run could not be fetched, or status.json and data.json disagree on the build. This page shows no data rather than a stale or mismatched snapshot, and will retry automatically.</p></div></div>';
  document.getElementById("freshtxt").textContent="Load failed";document.getElementById("freshdot").className="dot fail";
}
function adoptBuild(r){
  DATA=r.data; BUILD=r.build; refreshState="live";
  const h=(location.hash||"").replace("#","");
  if(SECTIONS[h])curNav=h;
  render(); startPolling();
}
function startRetry(){
  if(retryTimer!=null) return;
  retryTimer=setInterval(async()=>{
    const r=await tryRefresh(null);                 // same version contract on recovery
    if(r.action==="update"){ clearInterval(retryTimer); retryTimer=null; adoptBuild(r); }
  },30000);
}
(async function(){
  const r=await tryRefresh(null);                   // same version contract on initial load
  if(r.action==="update"){ adoptBuild(r); return; }
  // Offline / file:// (standalone build): no server to fetch — use the inline
  // snapshot build_standalone injected. No polling without a server.
  const inl=inlineData();
  if(inl){ DATA=inl; BUILD=idOf(inl); refreshState="live";
    const h=(location.hash||"").replace("#","");if(SECTIONS[h])curNav=h; render(); return; }
  showLoadError(); startRetry();
})();
</script>
